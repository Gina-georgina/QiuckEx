name: CD Release Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          push: true
          tags: |
            ghcr.io/viky207/quickex-backend:${{ github.sha }}
            ghcr.io/viky207/quickex-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/viky207/quickex-backend:${{ github.sha }}
          format: sarif
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  rc-validate:
    name: Release candidate validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install secret scanner
        run: pip install detect-secrets

      - name: Run release candidate gate
        env:
          STELLAR_NETWORK: testnet
          RC_BASE_REF: origin/main
        run: ./scripts/rc-validate.sh --quick

  migration-smoke-test:
    name: Migration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify migrations apply cleanly against fresh test schema
        env:
          MIGRATION_SMOKE_TEST: '1'
          MIGRATION_TEST_SCHEMA: 'migration_smoke_test'
          MIGRATION_STATE_FILE: '/tmp/quickex-cd-migration-smoke-db.json'
        run: |
          node app/backend/run-migration-supabase.js \
            --smoke-test \
            --schema migration_smoke_test \
            --state-file /tmp/quickex-cd-migration-smoke-db.json
          ./scripts/rollback-migration.sh \
            --schema migration_smoke_test \
            --state-file /tmp/quickex-cd-migration-smoke-db.json
          node app/backend/run-migration-supabase.js \
            --schema migration_smoke_test \
            --state-file /tmp/quickex-cd-migration-smoke-db.json
          node app/backend/scripts/verify-migrations.js
          node --test scripts/rollback-migration.test.js

  release:
    runs-on: ubuntu-latest
    needs: [build-and-push-image, rc-validate, migration-smoke-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Task 4: Generate explicit version logging
      - name: Generate Release Metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_TAG="$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "::notice::Deploying version $VERSION_TAG from commit $SHORT_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate blue-green deployment configuration
        env:
          BLUE_URL: ${{ vars.PRODUCTION_BLUE_URL }}
          GREEN_URL: ${{ vars.PRODUCTION_GREEN_URL }}
          TRAFFIC_CONTROLLER_URL: ${{ vars.PRODUCTION_TRAFFIC_CONTROLLER_URL }}
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for name in BLUE_URL GREEN_URL TRAFFIC_CONTROLLER_URL DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Required production deployment setting ${name} is missing"
              exit 1
            fi
          done
          for name in BLUE_URL GREEN_URL TRAFFIC_CONTROLLER_URL; do
            case "${!name}" in
              https://*) ;;
              *) echo "::error::${name} must use HTTPS"; exit 1 ;;
            esac
          done
          if [ "${BLUE_URL%/}" = "${GREEN_URL%/}" ]; then
            echo "::error::Blue and green deployment URLs must be different"
            exit 1
          fi

      # Task 2 & AC 2: Apply Migrations Exactly Once Before App Rollout
      # It searches your monorepo apps for migration scripts and executes them safely
      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Applying database migrations safely..."
          pnpm turbo run db:migrate --continue

      - name: Read active production slot
        id: active-slot
        env:
          TRAFFIC_CONTROLLER_URL: ${{ vars.PRODUCTION_TRAFFIC_CONTROLLER_URL }}
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          active_payload=$(curl --fail --show-error --silent --max-time 30 \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            "${TRAFFIC_CONTROLLER_URL%/}/active")
          active_slot=$(jq -er '.target | select(. == "blue" or . == "green")' <<< "$active_payload")
          echo "target=${active_slot}" >> "$GITHUB_OUTPUT"

      - name: Deploy inactive slot, verify readiness, and switch traffic
        id: deploy-inactive-slot
        env:
          BLUE_URL: ${{ vars.PRODUCTION_BLUE_URL }}
          GREEN_URL: ${{ vars.PRODUCTION_GREEN_URL }}
          TRAFFIC_CONTROLLER_URL: ${{ vars.PRODUCTION_TRAFFIC_CONTROLLER_URL }}
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          IMAGE: ghcr.io/viky207/quickex-backend:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          controller_url="${TRAFFIC_CONTROLLER_URL%/}"
          active_slot="${{ steps.active-slot.outputs.target }}"
          if [ "$active_slot" = "blue" ]; then
            target_slot=green
            target_url="$GREEN_URL"
          else
            target_slot=blue
            target_url="$BLUE_URL"
          fi

          deploy_payload=$(jq -n --arg image "$IMAGE" --arg sha "$DEPLOY_SHA" \
            --arg slot "$target_slot" \
            '{image: $image, sha: $sha, environment: "production", slot: $slot}')
          curl --fail --show-error --silent --max-time 30 \
            -X POST "${target_url%/}/_deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$deploy_payload"

          ready_url="${target_url%/}/health/ready"
          echo "Waiting for ${target_slot} readiness at ${ready_url}"
          ready=0
          for attempt in $(seq 1 24); do
            status=$(curl --output /dev/null --silent --show-error \
              --connect-timeout 5 --max-time 10 --write-out '%{http_code}' \
              "$ready_url" 2>/dev/null || true)
            if [ "$status" = "200" ]; then
              echo "${target_slot} is ready (attempt ${attempt})"
              ready=1
              break
            fi
            echo "Readiness attempt ${attempt}/24 returned ${status:-000}"
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::${target_slot} deployment did not become ready; ${active_slot} remains active"
            exit 1
          fi

          switch_payload=$(jq -n --arg target "$target_slot" --arg sha "$DEPLOY_SHA" \
            '{target: $target, sha: $sha}')
          curl --fail --show-error --silent --max-time 30 \
            -X POST "${controller_url}/switch" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$switch_payload"
          echo "::notice::Traffic switched to ${target_slot} for ${DEPLOY_SHA}"

      - name: Roll traffic back to the previous active slot
        if: failure() && steps.deploy-inactive-slot.outcome == 'failure'
        env:
          TRAFFIC_CONTROLLER_URL: ${{ vars.PRODUCTION_TRAFFIC_CONTROLLER_URL }}
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          ACTIVE_SLOT: ${{ steps.active-slot.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "$TRAFFIC_CONTROLLER_URL" ] || [ -z "$DEPLOY_TOKEN" ] || [ -z "$ACTIVE_SLOT" ]; then
            echo "::warning::Rollback could not run because controller configuration or active slot is unavailable"
            exit 0
          fi
          rollback_payload=$(jq -n --arg target "$ACTIVE_SLOT" '{target: $target}')
          curl --fail --show-error --silent --max-time 30 \
            -X POST "${TRAFFIC_CONTROLLER_URL%/}/switch" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$rollback_payload"
          echo "::notice::Traffic rollback to ${ACTIVE_SLOT} completed"

      # Task: Upload Sentry source maps so production stack traces are de-minified
      # and tagged with the release (git SHA).
      - name: Upload Sentry Source Maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm --filter @quickex/backend sentry:sourcemaps

