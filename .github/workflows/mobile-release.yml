name: Mobile Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runMatrix:
        description: 'Build dev, staging, and production internal artifacts'
        required: false
        default: 'true'

jobs:
  production-release:
    if: github.event_name == 'push'
    name: Production Release Tag Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    strategy:
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint and type-check
        run: pnpm run build

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Authenticate EAS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas login --token "$EAS_TOKEN"

      - name: Build production internal artifact
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          eas build --platform ${{ matrix.platform }} --profile production --non-interactive

  environment-matrix:
    if: github.event_name == 'workflow_dispatch'
    name: Environment Matrix Internal Builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    strategy:
      matrix:
        platform: [android, ios]
        app_env: [dev, staging, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint and type-check
        run: pnpm run build

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Authenticate EAS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas login --token "$EAS_TOKEN"

      - name: Build internal artifact
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          eas build --platform ${{ matrix.platform }} --profile ${{ matrix.app_env }} --non-interactive

  maestro-android:
    name: Maestro UI Tests (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/mobile
    env:
      EXPO_PUBLIC_USE_MOCK_API: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Android debug APK
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease -x lint

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro scan-and-pay flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: app/mobile
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/scan-and-pay.yml --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: app/mobile/maestro-report.xml
          if-no-files-found: ignore
