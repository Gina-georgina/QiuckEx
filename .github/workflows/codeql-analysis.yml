name: CodeQL Analysis

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths:
              - app/backend/**
              - app/frontend/**
              - app/mobile/**

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results

      - name: Block high and critical findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find sarif-results -type f -name '*.sarif' -print0)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::CodeQL did not produce a SARIF report"
            exit 1
          fi

          failed=0
          for report in "${reports[@]}"; do
            count=$(jq '[.runs[] as $run | ($run.tool.driver.rules // [] | map({key: .id, value: (.properties["security-severity"] // "0" | tonumber)}) | from_entries) as $severity_by_rule | $run.results[]? | . as $result | ($severity_by_rule[$result.ruleId] // 0) as $severity | select($severity >= 7.0)] | length' "$report")
            if [ "$count" -gt 0 ]; then
              jq -r '.runs[] as $run | ($run.tool.driver.rules // [] | map({key: .id, value: (.properties["security-severity"] // "0" | tonumber)}) | from_entries) as $severity_by_rule | $run.results[]? | . as $result | ($severity_by_rule[$result.ruleId] // 0) as $severity | select($severity >= 7.0) | "::error title=High/Critical CodeQL finding::\($result.ruleId) (severity \($severity)): \($result.message.text // "No message")"' "$report"
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "No high or critical CodeQL findings."