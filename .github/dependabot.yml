version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      root-npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area:frontend"]
    groups:
      frontend-npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area:backend"]
    groups:
      backend-npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/app/mobile"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area:mobile"]
    groups:
      mobile-npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/app/contract"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area:contract"]
    groups:
      cargo-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area:ci"]
    groups:
      github-actions:
        update-types: ["minor", "patch"]
